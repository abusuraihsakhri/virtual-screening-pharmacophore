[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "virtual-screening-pharmacophore"
version = "2.0.0"
description = "PharmacoScreen: 3D Pharmacophore Feature Alignment & Database Screening Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
virtual-screening-pharmacophore = "pharmaco_screen.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/virtual-screening-pharmacophore"
Repository = "https://github.com/abusuraihsakhri/virtual-screening-pharmacophore.git"
