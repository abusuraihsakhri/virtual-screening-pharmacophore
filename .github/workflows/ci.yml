name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[web,test]"
          python -m pip check
      - name: Generate isolated test audit key
        run: echo "AUDIT_SECRET_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> "$GITHUB_ENV"
      - name: Compile Python sources
        run: python -m compileall -q agents pharmaco_screen tests cli.py enrichment.py simulator.py
      - name: Run tests
        run: python -m pytest -q
      - name: Audit chain smoke test
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
      - name: Validate static JavaScript
        run: |
          node --check web/app.js
          node tests/test_web.cjs
