version: '3.8'

services:
  virtual-screening-pharmacophore:
    build: .
    container_name: virtual-screening-pharmacophore
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=virtual-screening-pharmacophore-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
